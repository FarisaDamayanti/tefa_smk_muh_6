user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Load balancing configuration
    upstream mischool_backend {
        least_conn;
        server app_worker_1:9000 weight=1 max_fails=3 fail_timeout=30s;
        server app_worker_2:9000 weight=1 max_fails=3 fail_timeout=30s;
        server app_worker_3:9000 weight=1 max_fails=3 fail_timeout=30s;
    }

    # Include server configurations
    include /etc/nginx/sites-available/*;
}